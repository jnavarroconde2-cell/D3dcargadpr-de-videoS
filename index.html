<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Downloader Pro v2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1f1f1f;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff9900;
            text-align: center;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus {
            border-color: #ff9900;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff9900;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #555;
            color: #aaa;
        }
        #msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
        .loader {
            border: 3px solid #333;
            border-top: 3px solid #ff9900;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #resultArea {
            margin-top: 20px;
            display: none;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        #dlBtn {
            background: #007bff;
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-weight: bold;
        }
        .err { color: #ff5555; }
        .ok { color: #55ff55; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔞 DL Pro</h2>
    <input type="text" id="urlInput" placeholder="Pega el link de Pornhub/XVideos..." autocomplete="off">
    <button id="btn" onclick="getVideo()">OBTENER VIDEO</button>
    
    <div id="msg"></div>

    <div id="resultArea">
        <p style="margin:0; color:#fff;">Video listo:</p>
        <a id="dlBtn" href="#" download>GUARDAR EN CELULAR</a>
    </div>
</div>

<script>
async function getVideo() {
    const url = document.getElementById('urlInput').value.trim();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const resArea = document.getElementById('resultArea');
    const dlBtn = document.getElementById('dlBtn');

    if (!url) {
        showMsg("Pega un enlace primero.", "err");
        return;
    }

    // Reset UI
    btn.disabled = true;
    btn.innerText = "Procesando...";
    msg.innerHTML = '<span class="loader"></span> Buscando fuente...';
    msg.className = "";
    resArea.style.display = "none";

    try {
        // Usamos una API robusta que maneja redirecciones y HLS
        // Esta API es pública y funciona bien para descargas directas
        const apiUrl = `https://api.cobalt.tools/api/json`;
        
        // Intentamos obtener el video
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                url: url,
                filenamePattern: "original",
                isAudioOnly: false,
                audioFormat: "mp3",
                filenameCustomization: "",
                alwaysIncludeHls: false,
                disableFileArbitraryExtension: false,
                downloadMode: "auto"
            })
        });

        const data = await response.json();

        if (data.url) {
            // Éxito
            showMsg("¡Encontrado!", "ok");
            dlBtn.href = data.url;
            
            // Generar nombre de archivo seguro
            const cleanName = url.split('/').pop().split('?')[0] || "video.mp4";
            dlBtn.download = cleanName + ".mp4";
            
            resArea.style.display = "block";
            btn.innerText = "Descargar Video";
            btn.disabled = false;
        } else {
            throw new Error(data.error?.code || "No se pudo extraer el video.");
        }

    } catch (error) {
        console.error(error);
        showMsg("Error: " + (error.message || "Servicio ocupado. Intenta de nuevo."), "err");
        btn.innerText = "Reintentar";
        btn.disabled = false;
    }
}

function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.innerText = text;
    msg.className = type;
}
</script>

</body>
</html>
