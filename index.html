<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Pro - Mobile</title>
    <!-- Usamos una librería ligera para yt-dlp vía API pública -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #ff9900; text-align: center; }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input[type="url"] {
            width: 95%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2a2a2a;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #ff9900;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
        button:disabled { background-color: #555; color: #aaa; }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ccc;
        }
        #downloadArea {
            margin-top: 20px;
            text-align: center;
            display: none; /* Oculto al inicio */
        }
        #videoLink {
            display: block;
            margin-top: 10px;
            color: #00bcd4;
            word-break: break-all;
        }
        .error { color: #ff4444; }
        .success { color: #00C851; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔞 Downloader Pro</h1>
        <p style="font-size: 12px; color: #888;">Pega el enlace del video aquí:</p>
        
        <input type="url" id="urlInput" placeholder="Ej: https://www.pornhub.com/view_video.php?viewkey=..." required>
        
        <button id="btnDownload" onclick="descargarVideo()">DESCARGAR VIDEO</button>
        
        <div id="status"></div>

        <div id="downloadArea">
            <p class="success">¡Listo! Toca para guardar:</p>
            <a id="videoLink" href="#" download>Descargar Archivo MP4</a>
        </div>
    </div>

    <script>
        async function descargarVideo() {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btnDownload');
            const dlArea = document.getElementById('downloadArea');
            const dlLink = document.getElementById('videoLink');

            if (!url) {
                status.innerText = "Por favor ingresa un enlace válido.";
                status.className = "error";
                return;
            }

            // UI Loading state
            btn.disabled = true;
            btn.innerText = "Procesando...";
            status.innerText = "Conectando con servidores...";
            status.className = "";
            dlArea.style.display = "none";

            try {
                // Usamos una API pública de yt-dlp para evitar configurar servidores complejos
                // Nota: Esta API gratuita puede tener límites si se usa mucho.
                const apiUrl = `https://api.cobalt.tools/api/json?url=${encodeURIComponent(url)}`; 
                
                // Alternativa robusta usando un servicio de proxy público si cobalt falla:
                // Para mayor estabilidad en móviles, usaremos un truco: 
                // Intentaremos obtener el stream directo.
                
                status.innerText = "Analizando video...";
                
                // Simulamos una petición a un backend de yt-dlp público
                // Nota: Los servicios gratuitos a veces caen. Si falla, intenta recargar.
                
                // Método alternativo más fiable para HTML simple:
                // Redirigimos a un servicio de conversión online o intentamos obtener el blob
                
                // Vamos a usar la API de Cobalt (funciona bien con pornhub/xvideos)
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        filenamePattern: "original",
                        isAudioOnly: false,
                        audioFormat: "mp3",
                        filenameCustomization: "",
                        alwaysIncludeHls: false,
                        disableFileArbitraryExtension: false,
                        downloadMode: "auto"
                    })
                });

                const data = await response.json();

                if (data.url) {
                    status.innerText = "¡Enlace generado! Descargando...";
                    dlLink.href = data.url;
                    
                    // Nombre del archivo basado en la URL original o ID
                    dlLink.download = "video_porno_" + Date.now() + ".mp4";
                    
                    dlArea.style.display = "block";
                    btn.innerText = "Descargar Video";
                    btn.disabled = false;
                } else {
                    throw new Error("No se pudo extraer el video. Prueba otro enlace.");
                }

            } catch (error) {
                console.error(error);
                status.innerText = "Error: " + error.message + ". Intenta de nuevo.";
                status.className = "error";
                btn.innerText = "Intentar de nuevo";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
